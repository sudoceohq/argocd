---
vault:
  global:
    tlsDisable: false
  injector:
    enabled: false
  ui:
    enabled: false
  server:
    image:
      repository: hashicorp/vault
      tag: 2.0.4
    updateStrategyType: OnDelete
    extraArgs: "-config=/vault/userconfig/vault-seal/seal.hcl"
    extraEnvironmentVars:
      GOOGLE_APPLICATION_CREDENTIALS: "/vault/userconfig/vault-kms/credentials.json"
      VAULT_CACERT: "/vault/userconfig/vault-tls/ca.crt"
      VAULT_TLS_SERVER_NAME: vault.vault.svc
    volumes:
    - name: vault-tls
      secret:
        secretName: vault-tls
        defaultMode: 288
    - name: vault-seal
      secret:
        secretName: vault-seal
        defaultMode: 288
    - name: vault-kms
      secret:
        secretName: vault-kms
        defaultMode: 288
    volumeMounts:
    - name: vault-tls
      mountPath: "/vault/userconfig/vault-tls"
      readOnly: true
    - name: vault-seal
      mountPath: "/vault/userconfig/vault-seal"
      readOnly: true
    - name: vault-kms
      mountPath: "/vault/userconfig/vault-kms"
      readOnly: true
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: longhorn
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    auditStorage:
      enabled: true
      size: 2Gi
      storageClass: longhorn
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
    livenessProbe:
      enabled: false
    serviceAccount:
      create: true
      name: vault
      createSecret: false
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          disable_mlock = true
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file = "/vault/userconfig/vault-tls/tls.key"
            tls_min_version = "tls12"
          }
          storage "raft" {
            path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal.vault.svc:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault.vault.svc"
          }
          retry_join {
            leader_api_addr = "https://vault-1.vault-internal.vault.svc:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault.vault.svc"
          }
          retry_join {
            leader_api_addr = "https://vault-2.vault-internal.vault.svc:8200"
            leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
            leader_tls_servername = "vault.vault.svc"
          }
          }
          service_registration "kubernetes" {}
      disruptionBudget:
        enabled: true
        maxUnavailable: 1
      apiAddr: https://vault-active.vault.svc:8200
    statefulSet:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
# Explicit NetworkPolicy peers for private remote-cluster certificate controllers.
apiIngressPeers: []
