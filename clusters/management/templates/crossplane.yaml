{{- if and (and .Values.cluster.enabled .Values.stages.foundation) (eq .Values.cluster.role "management") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ if ne .Values.cluster.id "management" }}{{ .Values.cluster.id }}-{{ end }}crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: {{ .Values.cluster.id }}
  source:
    repoURL: https://github.com/sudoceohq/argocd.git
    targetRevision: main
    helm:
      releaseName: crossplane
      valueFiles:
      - "../../clusters/{{ .Values.cluster.id }}/cluster.yaml"
    path: charts/crossplane
  destination:
    server: {{ .Values.cluster.server | quote }}
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        istio-injection: disabled
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
